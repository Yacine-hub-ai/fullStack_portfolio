services:

  # ── Base de données MongoDB (local) ────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: portfolio-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"      # MongoDB Compass → localhost:27017
    volumes:
      - mongo_data:/data/db
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── API Express (backend) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - portfolio-net

  # ── Frontend Nginx ──────────────────────────────────────────
  frontend:
    build:
      context: ..                    # dossier Express_mongo (contient index.html)
      dockerfile: docker/frontend/Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - portfolio-net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

# ── Réseau interne ───────────────────────────────────────────
networks:
  portfolio-net:
    driver: bridge
