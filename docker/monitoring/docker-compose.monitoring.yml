services:

  # ── Prometheus ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: portfolio-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'         # Rechargement config à chaud via POST /-/reload
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring-net
      - portfolio-net   # Accès au backend portfolio

  # ── AlertManager ─────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: portfolio-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    environment:
      - SMTP_PASSWORD=${SMTP_PASSWORD:-changeme}
    networks:
      - monitoring-net

  # ── Grafana ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: portfolio-grafana
    restart: unless-stopped
    ports:
      - "3030:3000"   # 3030 pour ne pas conflicté avec le frontend (3000)
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3030
      - GF_ALERTING_ENABLED=true
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  # ── Node Exporter (métriques système) ────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: portfolio-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring-net

  # ── MongoDB Exporter ─────────────────────────────────────────
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: portfolio-mongodb-exporter
    restart: unless-stopped
    command:
      - '--mongodb.uri=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin}@portfolio-mongodb:27017/admin'
      - '--collect-all'
    ports:
      - "9216:9216"
    networks:
      - monitoring-net
      - portfolio-net   # Accès au conteneur MongoDB

  # ── cAdvisor (métriques conteneurs) ──────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: portfolio-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8090:8080"   # 8090 pour éviter les conflits
    networks:
      - monitoring-net

# ── Volumes persistants ───────────────────────────────────────
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

# ── Réseaux ───────────────────────────────────────────────────
networks:
  monitoring-net:
    driver: bridge
  portfolio-net:
    external: true   # Réseau créé par docker/docker-compose.yml
    name: docker_portfolio-net
