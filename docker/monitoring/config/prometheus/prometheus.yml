global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: 'local'
    project:     'portfolio'

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'portfolio-backend'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Frontend Nginx ────────────────────────────────────────────
  - job_name: 'portfolio-frontend'
    static_configs:
      - targets: ['frontend:80']
    metrics_path: /
    scrape_interval: 15s

  # ── SonarQube ─────────────────────────────────────────────────
  - job_name: 'sonarqube'
    static_configs:
      - targets: ['host.docker.internal:9000']
    metrics_path: /api/system/status
    scrape_interval: 30s

  # ── MongoDB ───────────────────────────────────────────────────
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  # ── Node Exporter ─────────────────────────────────────────────
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ── cAdvisor ──────────────────────────────────────────────────
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
