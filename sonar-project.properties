sonar.projectKey=portfolio-fullstack
sonar.projectName=Portfolio Fullstack
sonar.projectVersion=1.0

# Analyser uniquement le backend (JS léger)
sonar.sources=docker/backend
sonar.exclusions=**/node_modules/**,**/*.test.js,**/package-lock.json

# Désactiver l'analyse TypeScript/JS avancée pour économiser la mémoire
sonar.javascript.node.maxspace=512

# Encodage
sonar.sourceEncoding=UTF-8
