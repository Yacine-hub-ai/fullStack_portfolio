<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Ajouter un projet</title>
        <link rel="stylesheet" href="">
    </head>
    <body>
        <header>
            <h1>Ajouter un projet</h1>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="lister-projets.html">Liste des projets</a>
            </nav>
        </header>
        <main class="container">

            <form>
          
              <label>Libellé :</label><br>
              <input type="text" required><br><br>
          
              <label>Description :</label><br>
              <textarea required></textarea><br><br>
          
              <label>Image :</label><br>
              <input type="file" accept="image/*"><br><br>
          
              <label>Technologies utilisées :</label><br>
              <input type="text" placeholder="HTML, CSS, JS"><br><br>
          
              <button type="submit">Ajouter</button>
          
            </form>
          
          </main>
    </body>
</html>
