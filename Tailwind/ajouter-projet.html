<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Ajouter un projet</title>
        <link rel="stylesheet" href="./src/output.css">
    </head>
    <body class="bg-gray-100">
        <header class="flex justify-between items-center bg-gray-900 text-white p-4">
            <h1 class="text-xl font-bold">Ajouter un projet</h1>
            <nav class="flex gap-6">
                <a href="index.html" class="hover:text-blue-400 transition">Accueil</a>
                <a href="lister-projets.html" class="hover:text-blue-400 transition">Liste des projets</a>
            </nav>
        </header>
        <main class="container">

            <form action="lister-projets.html" method="post">
          
              <label>Libellé :</label><br>
              <input type="text" name="libelle" required><br><br>
          
              <label>Description :</label><br>
              <textarea name="description" required></textarea><br><br>
          
              <label>Image :</label><br>
              <input type="file"name="image"  accept="image/*"><br><br>
          
              <label>Technologies utilisées :</label><br>
              <input type="text" name="Technologies" placeholder="HTML, CSS, JS"><br><br>
          
              <button type="submit">Ajouter le projet</button>
          
            </form>
          
          </main>
    </body>
</html>
