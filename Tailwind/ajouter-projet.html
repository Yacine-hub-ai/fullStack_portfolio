<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Ajouter un projet</title>
        <link rel="stylesheet" href="./src/output.css">
    </head>
    <body class="bg-gray-100">
        <header class="flex justify-between items-center bg-gray-900 text-white p-4">
            <h1 class="text-xl font-bold">Ajouter un projet</h1>
            <nav class="flex gap-6">
                <a href="index.html" class="hover:text-blue-400 transition">Accueil</a>
                <a href="lister-projets.html" class="hover:text-blue-400 transition">Liste des projets</a>
            </nav>
        </header>
        <main class="max-w-xl mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">

            <form action="lister-projets.html" method="post" class="flex flex-col gap-4">
          
              <label class="block mb-1 font-semibold">Libellé :</label><br>
              <input type="text" name="libelle" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required><br><br>
          
              <label class="block mb-1 font-semibold">Description :</label><br>
              <textarea name="description" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required></textarea><br><br>
          
              <label class="block mb-1 font-semibold">Image :</label><br>
              <input type="file"name="image"  accept="image/*" class="w-full"><br><br>
          
              <label class="block mb-1 font-semibold">Technologies utilisées :</label><br>
              <input type="text" name="Technologies" placeholder="HTML, CSS, JS" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"><br><br>
          
              <button type="submit" class="bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">Ajouter le projet</button>
          
            </form>
          
          
          </main>
          <footer class="bg-gray-900 text-white text-center p-4 mt-6">
            <p>&copy; 2026 Fullstack Portfolio</p>
        </footer>
    </body>
</html>
